services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: trinity_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trinity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trinity_pass}
      POSTGRES_DB: ${POSTGRES_DB:-trinity_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trinity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trinity_network

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.15-community
    container_name: trinity_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    healthcheck:
      # We check if the HTTP port is responding. No password needed for a basic ping.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s # Neo4j needs a full minute sometimes to wake up
    networks:
      - trinity_network

  # ChromaDB Vector Database
  chromadb:
    image: ghcr.io/chroma-core/chroma:0.5.23
    container_name: trinity_chromadb
    restart: unless-stopped
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "8000:8000"
    # Note: Healthcheck removed to prevent dependency loops since the
    # minimal Chroma image often lacks the tools to run the test itself.
    networks:
      - trinity_network

  # Ollama LLM Host
  ollama:
    image: ollama/ollama:latest
    container_name: trinity_ollama
    restart: unless-stopped
    # GPU acceleration (NVIDIA on Docker Desktop / WSL2):
    # Use the override file instead of editing this compose:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 6G
    environment:
      - OLLAMA_LISTEN=0.0.0.0:11434
      - LLM_MODEL_ID=${LLM_MODEL_ID:-llama3.2:3b}
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    entrypoint: >-
      /bin/sh -c "
        ollama serve &
        sleep 10;
        ollama pull \"$LLM_MODEL_ID\";
        wait
      "
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - trinity_network

  # n8n Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: trinity_n8n
    restart: unless-stopped
    environment:
      - N8N_BLOCK_DATA_COLLECTION=true
      - GENERIC_TIMEZONE=UTC
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - trinity_network

  # Redis (for background tasks)
  redis:
    image: redis:7-alpine
    container_name: trinity_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trinity_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trinity_backend
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-trinity}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-trinity_pass}
      - POSTGRES_DB=${POSTGRES_DB:-trinity_db}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_PERSIST_DIR=${CHROMA_PERSIST_DIR:-/data}
      - REDIS_HOST=redis
      - SECRET_KEY=${SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
      - USE_SQLITE=False
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - LLM_MODEL_ID=${LLM_MODEL_ID:-llama3.2:3b}
      - USE_LANGCHAIN=${USE_LANGCHAIN:-true}
      - USE_LANGGRAPH=${USE_LANGGRAPH:-true}
      - NVD_API_KEY=${NVD_API_KEY:-}
      - NVD_BASE_URL=${NVD_BASE_URL:-https://services.nvd.nist.gov/rest/json/cves/2.0}
      - NVD_RESULTS_PER_PAGE=${NVD_RESULTS_PER_PAGE:-2000}
      - CVE_SYNC_INTERVAL_HOURS=${CVE_SYNC_INTERVAL_HOURS:-6}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/cve-sync}
      - SCOPE_SUBNET=${SCOPE_SUBNET:-10.10.0.0/24}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://192.168.75.1:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started # Starts backend as soon as Chroma container is up
      ollama:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - trinity_network
      - trinity_lab_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trinity_celery_worker
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-trinity}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-trinity_pass}
      - POSTGRES_DB=${POSTGRES_DB:-trinity_db}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_PERSIST_DIR=${CHROMA_PERSIST_DIR:-/data}
      - REDIS_HOST=redis
      - SECRET_KEY=${SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
      - USE_SQLITE=False
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - LLM_MODEL_ID=${LLM_MODEL_ID:-llama3.2:3b}
      - USE_LANGCHAIN=${USE_LANGCHAIN:-true}
      - USE_LANGGRAPH=${USE_LANGGRAPH:-true}
      - NVD_API_KEY=${NVD_API_KEY:-}
      - NVD_BASE_URL=${NVD_BASE_URL:-https://services.nvd.nist.gov/rest/json/cves/2.0}
      - NVD_RESULTS_PER_PAGE=${NVD_RESULTS_PER_PAGE:-2000}
      - CVE_SYNC_INTERVAL_HOURS=${CVE_SYNC_INTERVAL_HOURS:-6}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/cve-sync}
      - SCOPE_SUBNET=${SCOPE_SUBNET:-10.10.0.0/24}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://192.168.75.1:5173}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - ./backend:/app
    networks:
      - trinity_network
      - trinity_lab_network
    command: celery -A app.celery_app.celery worker --loglevel=info

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trinity_celery_beat
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-trinity}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-trinity_pass}
      - POSTGRES_DB=${POSTGRES_DB:-trinity_db}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_PERSIST_DIR=${CHROMA_PERSIST_DIR:-/data}
      - REDIS_HOST=redis
      - SECRET_KEY=${SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
      - USE_SQLITE=False
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - LLM_MODEL_ID=${LLM_MODEL_ID:-llama3.2:3b}
      - USE_LANGCHAIN=${USE_LANGCHAIN:-true}
      - USE_LANGGRAPH=${USE_LANGGRAPH:-true}
      - NVD_API_KEY=${NVD_API_KEY:-}
      - NVD_BASE_URL=${NVD_BASE_URL:-https://services.nvd.nist.gov/rest/json/cves/2.0}
      - NVD_RESULTS_PER_PAGE=${NVD_RESULTS_PER_PAGE:-2000}
      - CVE_SYNC_INTERVAL_HOURS=${CVE_SYNC_INTERVAL_HOURS:-6}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/cve-sync}
      - SCOPE_SUBNET=${SCOPE_SUBNET:-10.10.0.0/24}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://192.168.75.1:5173}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - ./backend:/app
    networks:
      - trinity_network
      - trinity_lab_network
    command: celery -A app.celery_app.celery beat --loglevel=info

  # =====================
  # Intentionally Vulnerable Lab Targets (opt-in)
  # Start with: docker compose --profile lab up -d
  # =====================

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: trinity_lab_juice_shop
    restart: unless-stopped
    profiles: ["lab"]
    # Optional: browse locally at http://localhost:3001
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      trinity_lab_network:
        ipv4_address: 10.10.0.11

  webgoat:
    image: webgoat/webgoat:latest
    container_name: trinity_lab_webgoat
    restart: unless-stopped
    profiles: ["lab"]
    # Optional: browse locally at http://localhost:3002/WebGoat
    ports:
      - "127.0.0.1:3002:8080"
    environment:
      - TZ=UTC
    networks:
      trinity_lab_network:
        ipv4_address: 10.10.0.12

volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  chroma_data:
    driver: local
  redis_data:
    driver: local
  ollama_models:
    driver: local
  n8n_data:
    driver: local

networks:
  trinity_network:
    driver: bridge

  # Dedicated lab network with fixed subnet (safe for local testing).
  trinity_lab_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24